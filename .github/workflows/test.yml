name: Create S3 Bucket

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout    

jobs:
  create-bucket:
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
        
      - name: Log a message
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - run: terraform init
        working-directory: ./terraform

      - name: terraform plan
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          terraform plan \
           -var="bucket_name=${{ secrets.BUCKET_NAME }}"
        working-directory: ./terraform

      - name: terraform apply
        env:
          TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
        run: |
          terraform apply \
            -auto-approve -no-color
        working-directory: ./terraform

      - name: upload to S3 bucket
        run: |
          aws s3 cp index.html s3://${{ secrets.BUCKET_NAME }}/index.html
          aws s3 cp --recursive images s3://${{ secrets.BUCKET_NAME }}/images/
          aws s3 cp --recursive styles s3://${{ secrets.BUCKET_NAME }}/styles/
